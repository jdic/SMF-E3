<svg width="320" height="240" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="background" x="0" y="0" width="320" height="240" fill="#000000"/>
  <g id="top_bar">
    <rect id="header_bg" x="0" y="0" width="320" height="28" fill="#FF8200"/>
    <text id="header_mode_text" x="10" y="20" fill="#000000" font-family="monospace" font-size="16" font-weight="bold">MODO: RECUPERACION MAN.</text>
  </g>
  <g id="content_recovery">
    <g id="card_fault_cause">
      <rect x="2.5" y="32.5" width="315" height="35" fill="#000000" stroke="#DE0000"/>
      <text x="8" y="44" fill="#C6C3C6" font-family="monospace" font-size="8">CAUSA DEL PARO (CORREGIR ANTES DE REARMAR):</text>
      <text x="6" y="63" fill="#DE0000" font-family="monospace" font-size="16" font-weight="bold" xml:space="preserve">E203: TIMEOUT BAJADA LLEN </text>
    </g>
    <g id="card_axes_status">
      <rect x="2.5" y="72.5" width="315" height="29" fill="#000000" stroke="#313031"/>
      <text x="8" y="84" fill="#C6C3C6" font-family="monospace" font-size="8">Z1:</text>
      <text x="30" y="84" fill="#00FFFF" font-family="monospace" font-size="8" xml:space="preserve">  420 LIBRE </text>
      <text x="8" y="96" fill="#C6C3C6" font-family="monospace" font-size="8">Z2:</text>
      <text x="30" y="96" fill="#00BC00" font-family="monospace" font-size="8" xml:space="preserve">    0 [HOME]</text>
      <text x="176" y="84" fill="#C6C3C6" font-family="monospace" font-size="8">ESTOP:</text>
      <text x="214" y="84" fill="#313031" font-family="monospace" font-size="8">[OFF]</text>
      <text x="176" y="96" fill="#FF8200" font-family="monospace" font-size="8">NAVEGACION BLOQUEADA</text>
    </g>
    <g id="recovery_buttons">
      <g id="btn_jog_fill_up">
        <rect x="8.5" y="108.5" width="147" height="35" fill="#0049AD" stroke="#00FFFF"/>
        <text x="37" y="129" fill="#FFFFFF" font-family="monospace" font-size="8">SUBIR Z1 (+JOG)</text>
      </g>
      <g id="btn_jog_cap_up">
        <rect x="164.5" y="108.5" width="147" height="35" fill="#0049AD" stroke="#00FFFF"/>
        <text x="193" y="129" fill="#FFFFFF" font-family="monospace" font-size="8">SUBIR Z2 (+JOG)</text>
      </g>
      <g id="btn_release_arms">
        <rect x="8.5" y="150.5" width="303" height="33" fill="#0049AD" stroke="#00FFFF"/>
        <text x="82" y="170" fill="#FFFFFF" font-family="monospace" font-size="8">SOLTAR BRAZOS DE RETENCION</text>
      </g>
      <g id="btn_line_clear">
        <rect x="8.5" y="190.5" width="303" height="41" fill="#00BC00" stroke="#FFFFFF"/>
        <text x="70" y="217" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold">LINEA DESPEJADA</text>
      </g>
    </g>
  </g>
