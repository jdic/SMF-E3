<svg width="320" height="240" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect id="background" width="320" height="240" fill="#000000"/>

  <!-- Top Header Banner (Y = 0..28) -->
  <g id="top_bar">
    <rect id="header_bg" x="0" y="0" width="320" height="28" fill="#00BC00"/>
    <text id="header_mode_text" x="10" y="20" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold">MODO: OPERANDO EN LINEA</text>
  </g>

  <!-- Central Content Area (Y = 28..189) -->
  <g id="content_home">
    <!-- Card 1: Etapa 1 Llenado (X=6, Y=34, W=308, H=34) -->
    <g id="card_fill">
      <rect x="6.5" y="34.5" width="307" height="33" fill="#000000" stroke="#313031"/>
      <text x="14" y="54" fill="#C6C3C6" font-family="monospace" font-size="8">LLENADO:</text>
      <text x="74" y="57" fill="#00FFFF" font-family="monospace" font-size="16" font-weight="bold">BOMBEANDO</text>
    </g>

    <!-- Card 2: Etapa 2 Tapado (X=6, Y=72, W=308, H=34) -->
    <g id="card_cap">
      <rect x="6.5" y="72.5" width="307" height="33" fill="#000000" stroke="#313031"/>
      <text x="14" y="92" fill="#C6C3C6" font-family="monospace" font-size="8">TAPADO :</text>
      <text x="74" y="95" fill="#C6C3C6" font-family="monospace" font-size="16" font-weight="bold">ESPERA BOTELLA</text>
    </g>

    <!-- Card 3: Cola, Perfil y Produccion (X=6, Y=110, W=308, H=30) -->
    <g id="card_counters">
      <rect x="6.5" y="110.5" width="307" height="29" fill="#000000" stroke="#313031"/>
      <text x="14" y="128" fill="#C6C3C6" font-family="monospace" font-size="8">COLA:</text>
      <text x="48" y="128" fill="#FFFFFF" font-family="monospace" font-size="8">1/5</text>
      <text x="104" y="128" fill="#C6C3C6" font-family="monospace" font-size="8">PERFIL:</text>
      <text x="150" y="128" fill="#00FFFF" font-family="monospace" font-size="8">GRANDE</text>
      <text x="218" y="128" fill="#C6C3C6" font-family="monospace" font-size="8">PROD:</text>
      <text x="252" y="128" fill="#00BC00" font-family="monospace" font-size="8">   12</text>
    </g>

    <!-- Card 4: Banner de Diagnostico / Error (X=6, Y=144, W=308, H=34) -->
    <g id="card_alarm_banner">
      <rect x="6.5" y="144.5" width="307" height="33" fill="#000000" stroke="#313031"/>
      <text x="12" y="167" fill="#00BC00" font-family="monospace" font-size="16" font-weight="bold">OK: SISTEMA SIN ALARMAS</text>
    </g>
  </g>

  <!-- Optional HUD Overlay V/I (X=184, Y=29, W=130, H=26) -->
  <g id="overlay_vi_hud">
    <rect x="184.5" y="29.5" width="129" height="25" fill="#000000" stroke="#FFFF00"/>
    <text x="189" y="40" fill="#FFFF00" font-family="monospace" font-size="8">CLAMP-  85 ADC| 0.4A</text>
    <text x="189" y="51" fill="#FFFF00" font-family="monospace" font-size="8">FILL - 120 ADC| 0.5A</text>
  </g>

  <!-- Bottom Navigation Bar (Y = 190..239) -->
  <g id="bottom_nav_bar">
    <rect x="0.5" y="190.5" width="319" height="49" fill="#000000" stroke="#FFFFFF"/>
    <line x1="64.5" y1="190" x2="64.5" y2="240" stroke="#FFFFFF"/>
    <line x1="128.5" y1="190" x2="128.5" y2="240" stroke="#FFFFFF"/>
    <line x1="192.5" y1="190" x2="192.5" y2="240" stroke="#FFFFFF"/>
    <line x1="254.5" y1="190" x2="254.5" y2="240" stroke="#FFFFFF"/>
    <!-- Active Tab Indicator (Home) -->
    <rect id="active_tab_indicator" x="1" y="237" width="63" height="2" fill="#00FFFF"/>
    <rect x="8" y="191" width="48" height="48" fill="url(#pattern1_1_2)"/>
    <rect x="72" y="191" width="48" height="48" fill="url(#pattern2_1_2)"/>
    <rect x="136" y="191" width="48" height="48" fill="url(#pattern4_1_2)"/>
    <rect x="199" y="191" width="48" height="48" fill="url(#pattern3_1_2)"/>
    <rect x="267" y="195" width="40" height="40" fill="url(#pattern0_1_2)"/>
  </g>

  <defs>
    <pattern id="pattern0_1_2" patternContentUnits="objectBoundingBox" width="1" height="1">
      <use xlink:href="#image0_1_2" transform="scale(0.0208333)"/>
    </pattern>
    <pattern id="pattern1_1_2" patternContentUnits="objectBoundingBox" width="1" height="1">
      <use xlink:href="#image1_1_2" transform="scale(0.0208333)"/>
    </pattern>
    <pattern id="pattern2_1_2" patternContentUnits="objectBoundingBox" width="1" height="1">
      <use xlink:href="#image2_1_2" transform="scale(0.0208333)"/>
    </pattern>
    <pattern id="pattern3_1_2" patternContentUnits="objectBoundingBox" width="1" height="1">
      <use xlink:href="#image3_1_2" transform="scale(0.0208333)"/>
    </pattern>
    <pattern id="pattern4_1_2" patternContentUnits="objectBoundingBox" width="1" height="1">
      <use xlink:href="#image4_1_2" transform="scale(0.0208333)"/>
    </pattern>
    <image id="image0_1_2" width="48" height="48" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/>
    <image id="image1_1_2" width="48" height="48" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/>
    <image id="image2_1_2" width="48" height="48" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/>
    <image id="image3_1_2" width="48" height="48" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/>
    <image id="image4_1_2" width="48" height="48" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/>
  </defs>
</svg>
